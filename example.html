<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Between Forms — generative canvas study</title>
<style>
  :root{
    color-scheme:light;
    --paper:#f2ecdf;
    --ink:#25231e;
    --muted:#70695b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  .study{position:relative;width:100%;height:100%;min-height:340px;isolation:isolate;}
  canvas{display:block;width:100%;height:100%;}
  .label,.note{position:absolute;z-index:2;color:var(--muted);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none;}
  .label{top:18px;left:20px;}
  .note{right:20px;bottom:16px;text-align:right;}
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (max-width:520px){
    .study{min-height:320px;}
    .label{top:14px;left:15px;}
    .note{right:15px;bottom:12px;font-size:9px;}
  }
  @media (forced-colors:active){
    canvas{forced-color-adjust:none;}
  }
</style>
</head>
<body>
<main class="study" aria-labelledby="study-title" aria-describedby="study-description">
  <h1 id="study-title" class="visually-hidden">Between Forms</h1>
  <p id="study-description" class="visually-hidden">A quiet generative animation of dark and light geometric tiles. Paired forms expand, meet, exchange places, and dissolve into an open field.</p>
  <canvas id="art" role="img" aria-label="Dark and light geometric forms slowly emerge, tessellate, and dissolve in repeating cycles."></canvas>
  <div class="label" aria-hidden="true">between forms</div>
  <div class="note" aria-hidden="true">arrival / exchange / release</div>
</main>
<script>
  const canvas = document.getElementById('art');
  const context = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const colors = {
    paper:'#f2ecdf',
    ink:'#25231e',
    muted:'#70695b',
    wash:'rgba(37,35,30,.08)'
  };

  let width = 0;
  let height = 0;
  let pixelRatio = 1;
  let frameId = 0;
  let start = performance.now();

  const ease = value => value * value * (3 - 2 * value);
  const wave = value => .5 - .5 * Math.cos(value * Math.PI * 2);

  function resize(){
    const bounds = canvas.getBoundingClientRect();
    pixelRatio = Math.min(window.devicePixelRatio || 1,2);
    width = Math.max(1,bounds.width);
    height = Math.max(1,bounds.height);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    draw(reduceMotion.matches ? .34 : (performance.now() - start) / 14000);
  }

  function polygon(x,y,radius,sides,rotation){
    context.beginPath();
    for(let point = 0;point < sides;point++){
      const angle = rotation + point / sides * Math.PI * 2;
      const px = x + Math.cos(angle) * radius;
      const py = y + Math.sin(angle) * radius;
      if(point === 0) context.moveTo(px,py);
      else context.lineTo(px,py);
    }
    context.closePath();
  }

  function drawTile(x,y,size,phase,index){
    const polarity = (index % 2 === 0) ? 1 : -1;
    const pulse = wave(phase + index * .035);
    const turn = phase * Math.PI * polarity + Math.PI / 4;
    const radius = size * (.25 + ease(pulse) * .22);
    const offset = size * (.13 - pulse * .08) * polarity;
    const alpha = .16 + pulse * .62;

    context.save();
    context.translate(x,y);
    context.rotate(turn * .18);

    context.globalAlpha = alpha;
    context.strokeStyle = colors.ink;
    context.lineWidth = 1;
    polygon(-offset,0,radius,4,Math.PI / 4);
    context.stroke();

    context.globalAlpha = .08 + (1 - pulse) * .18;
    context.fillStyle = colors.ink;
    polygon(offset,0,radius,4,0);
    context.fill();

    context.globalAlpha = .2 + pulse * .45;
    context.strokeStyle = colors.muted;
    context.beginPath();
    context.arc(0,0,radius * (1.55 - pulse * .45),0,Math.PI * 2);
    context.stroke();

    context.globalAlpha = .42;
    context.fillStyle = polarity > 0 ? colors.ink : colors.paper;
    context.beginPath();
    context.arc(offset * 1.25,0,Math.max(1.5,size * .025),0,Math.PI * 2);
    context.fill();
    context.restore();
  }

  function draw(time){
    const phase = time % 1;
    const shorter = Math.min(width,height);
    const columns = width < 480 ? 4 : 6;
    const rows = width < 480 ? 5 : 4;
    const gap = Math.min(width / (columns + 1),height / (rows + 1));
    const fieldWidth = gap * (columns - 1);
    const fieldHeight = gap * (rows - 1);
    const originX = (width - fieldWidth) / 2;
    const originY = (height - fieldHeight) / 2;

    context.clearRect(0,0,width,height);
    context.fillStyle = colors.paper;
    context.fillRect(0,0,width,height);

    const veil = context.createRadialGradient(width / 2,height / 2,0,width / 2,height / 2,shorter * .62);
    veil.addColorStop(0,'rgba(255,252,241,.82)');
    veil.addColorStop(1,'rgba(242,236,223,0)');
    context.fillStyle = veil;
    context.fillRect(0,0,width,height);

    context.strokeStyle = colors.wash;
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(width * .12,height / 2);
    context.lineTo(width * .88,height / 2);
    context.moveTo(width / 2,height * .14);
    context.lineTo(width / 2,height * .86);
    context.stroke();

    let index = 0;
    for(let row = 0;row < rows;row++){
      for(let column = 0;column < columns;column++){
        const x = originX + column * gap;
        const y = originY + row * gap;
        const distance = Math.hypot(column - (columns - 1) / 2,row - (rows - 1) / 2);
        drawTile(x,y,gap,phase - distance * .055,index++);
      }
    }

    const closing = wave(phase);
    context.save();
    context.translate(width / 2,height / 2);
    context.rotate(phase * Math.PI);
    context.globalAlpha = .28 + closing * .46;
    context.strokeStyle = colors.ink;
    context.lineWidth = 1.2;
    polygon(0,0,gap * (.32 + closing * .22),4,Math.PI / 4);
    context.stroke();
    context.restore();
  }

  function animate(now){
    draw((now - start) / 14000);
    frameId = requestAnimationFrame(animate);
  }

  function setMotion(){
    cancelAnimationFrame(frameId);
    if(reduceMotion.matches){
      draw(.34);
    }else{
      start = performance.now();
      frameId = requestAnimationFrame(animate);
    }
  }

  new ResizeObserver(resize).observe(canvas);
  reduceMotion.addEventListener('change',setMotion);
  resize();
  setMotion();
</script>
</body>
</html>
